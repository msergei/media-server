networks:
  proxy:
    external: true

volumes:
  share: {}
  config: {}
  cache: {}  

services:
  transmission:
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.${TRS_PROJECT_NAME}.rule=Host(`${TRS_DOMAIN}`)
      - traefik.http.routers.${TRS_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${TRS_PROJECT_NAME}.tls.certresolver=myresolver
      - traefik.http.services.${TRS_PROJECT_NAME}.loadbalancer.server.port=9091
      - traefik.http.middlewares.${TRS_PROJECT_NAME}-auth.basicauth.users=${LOGIN}:${PASS_HASH}
      - traefik.http.routers.${TRS_PROJECT_NAME}.middlewares=${TRS_PROJECT_NAME}-auth,ratelimit,inflightreq,circuitbreaker,crowdsec-bouncer

  jellyfin:
    network_mode: host # Enable DLNA
    image: jellyfin/jellyfin
    # Without privileged mode Docker masks /sys/firmware and AppArmor denies it, so
    # Rockchip MPP can't read /proc/device-tree/compatible: the SoC shows up as
    # "unknown" and hevc_rkmpp fails to init (H.264 still works). Lift only these.
    security_opt:
      - systempaths=unconfined
      - apparmor:unconfined
    environment:
      - PUID=1000
      - PGID=200
      - TZ=Europe/Moscow
      - JELLYFIN_PublishedServerUrl=YOU_DOMAIN_OR_IP #optional
    volumes:
      - config:/config
      - cache:/cache
      - share:/share
      - /opt/vc/lib:/opt/vc/lib
#    ports:    # not active if host mode is activated
#      - 8096:8096
#      - 8920:8920 #optional
#      - 7359:7359/udp #optional
#      - 1900:1900/udp #optional
#    Behind Traefik (not in host mode): the web client asks for a thumbnail size that
#    follows the browser window width, and Jellyfin caches every size separately.
#    These redirects reduce the requests to the two sizes that
#    scripts/jellyfin-warm-thumbnails.py generates in advance.
#    labels:
#      - traefik.http.middlewares.jellyfin-thumbs-s.redirectregex.regex=^https?://[^/]+(/Items/[0-9a-fA-F-]+/Images/Primary)\?fillHeight=\d+&fillWidth=(?:[1-9]\d?|[1-3]\d\d|400)&quality=96&tag=([0-9a-fA-F]+)$$
#      - traefik.http.middlewares.jellyfin-thumbs-s.redirectregex.replacement=$${1}?fillWidth=400&quality=96&tag=$${2}
#      - traefik.http.middlewares.jellyfin-thumbs-s.redirectregex.permanent=true
#      - traefik.http.middlewares.jellyfin-thumbs-l.redirectregex.regex=^https?://[^/]+(/Items/[0-9a-fA-F-]+/Images/Primary)\?fillHeight=\d+&fillWidth=(?:40[1-9]|4[1-9]\d|[5-9]\d\d|1[01]\d\d|1200)&quality=96&tag=([0-9a-fA-F]+)$$
#      - traefik.http.middlewares.jellyfin-thumbs-l.redirectregex.replacement=$${1}?fillWidth=800&quality=96&tag=$${2}
#      - traefik.http.middlewares.jellyfin-thumbs-l.redirectregex.permanent=true
#      - traefik.http.routers.jellyfin.middlewares=jellyfin-thumbs-s,jellyfin-thumbs-l
    restart: always
    devices:
    #  RK3588 (Orange Pi 5 Max config)
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
      - /dev/mali0:/dev/mali0
      - /dev/rga:/dev/rga
      - /dev/mpp_service:/dev/mpp_service
