volumes:
  share: {}
  transmission: {}
  minidlna_logs: {}
  minidlna_cache: {}
  metube_downloads: {}
  massistant_data: {}

services:
  samba:
    build:
      context: .
      dockerfile: SambaDockerfile
    restart: always
    ports:
      - 445:445
    volumes:
      - share:/share
    environment:
      - USER=${USER}
      - PASS=${PASSWORD}

  transmission:
    build:
      context: .
      dockerfile: TransmissionDockerfile
    restart: always
    ports:
      - 9091:9091
    volumes:
      - share:/share
      - transmission:/var/lib/transmission-daemon
    environment:
      - TRANSMISSION_WEB_HOME=/combustion/combustion-release

  metube:
    image: ghcr.io/alexta69/metube
    container_name: metube
    restart: always
    ports:
      - 8081:8081
    volumes:
      - share:/share
      - metube_downloads:/downloads
    environment:
      - UID=1000
      - GID=200
      - DEFAULT_THEME=dark
      - DOWNLOAD_DIR=/share/youtube
      - "YTDL_OPTIONS={\"writesubtitles\": true, \"writeautomaticsub\": true}"
      - DOWNLOAD_DIRS_INDEXABLE=true
      - CUSTOM_DIRS=true
      - CREATE_CUSTOM_DIRS=true
      - STATE_DIR=/share/youtube/.metube
      - TEMP_DIR=/share/youtube/.temp

  dlna:
    build:
      context: .
      dockerfile: DlnaDockerfile
    restart: always
    network_mode: "host"
    volumes:
      - share:/share:ro
      - minidlna_logs:/var/log/minidlna
      - minidlna_cache:/var/cache/minidlna
    tmpfs:
      - /run/minidlna:mode=1777
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    environment:
      - MINIDLNA_CACHE_DIR=/var/cache/minidlna
      - MINIDLNA_LOG_DIR=/var/log/minidlna
    security_opt:
      - no-new-privileges:true
